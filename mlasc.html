<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马里奥赛车</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "Microsoft YaHei", "Heiti TC", "PingFang SC", "Hiragino Sans GB", sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            background-color: #222;
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #ffce00;
            text-shadow: 3px 3px #e60012;
            font-size: 40px;
            margin-bottom: 10px;
            font-style: italic;
        }

        p {
            color: white;
            font-size: 18px;
            text-shadow: 1px 1px #000;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            z-index: 10;
        }

        .btn {
            pointer-events: auto;
            background: #e60012;
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 10px;
        }

        .btn:hover {
            background: #ff4d4d;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="score-board" class="hidden">当前分数: 0</div>
    <div id="ui-layer">
        <div id="pause-screen" class="hidden">
            <h1>游戏已暂停</h1>
            <button class="btn" onclick="resumeGame()">继续游戏</button>
            <button class="btn" onclick="endGame()">结束游戏</button>
        </div>
        <div id="game-over-screen" class="">
            <h1>马里奥赛车</h1>
            <p>最高得分: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">开始游戏</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI 元素
    const pauseScreen = document.getElementById('pause-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreBoard = document.getElementById('score-board');
    const finalScoreSpan = document.getElementById('final-score');

    // 游戏状态
    let gameRunning = false;
    let isPaused = false;
    let score = 0;
    let gameSpeed = 5;
    let animationId;
    let frameCount = 0;

    // 玩家
    const player = {
        x: 0,
        y: 0,
        width: 50,
        height: 70,
        color: 'red',
        dx: 0,
        speed: 7,
        isSlipping: false,
        slipTime: 0,
        slipForce: 0
    };

    // 障碍物 & 卡车
    let obstacles = [];
    let truck = null;
    const truckInterval = 5 * 60;

    // ====================== 你要的调整 ======================
    // 水洼数量：从 8 → 3 个（更少）
    let puddles = [];
    const puddleCount = 3;

    // 漂移力度：从 6 → 2.5（更轻、更易控制）
    const MAX_SLIP_FORCE = 2.5;

    // 天气系统：晴天 / 下雨 / 大雾，自动切换
    let weather = 'sunny'; // sunny / rainy / foggy
    let weatherChangeTimer = 0;
    let weatherChangeDelay = 15 * 60; // 15秒切换一次

    // ======================================================

    // 雨滴
    let rainDrops = [];
    function initRain() {
        rainDrops = [];
        for (let i = 0; i < 150; i++) {
            rainDrops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: Math.random() * 8 + 6,
                length: Math.random() * 10 + 5
            });
        }
    }

    function drawRain() {
        if (weather !== 'rainy') return;
        ctx.strokeStyle = 'rgba(173, 216, 230, 0.6)';
        ctx.lineWidth = 1.5;
        rainDrops.forEach(drop => {
            ctx.beginPath();
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x, drop.y + drop.length);
            ctx.stroke();
            drop.y += drop.speed;
            if (drop.y > canvas.height) {
                drop.y = -drop.length;
                drop.x = Math.random() * canvas.width;
            }
        });
    }

    // 雾效果
    function drawFog() {
        if (weather !== 'foggy') return;
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    // 自动切换天气（修复版：保证一定会下雨）
    function autoChangeWeather() {
        weatherChangeTimer++;
        if (weatherChangeTimer >= weatherChangeDelay) {
            weatherChangeTimer = 0;
            
            // 修复：如果当前不是雨天，优先强制切一次雨天
            if (weather !== 'rainy' && Math.random() > 0.3) {
                weather = 'rainy';
            } else {
                // 正常随机
                const weathers = ['sunny', 'rainy', 'foggy'];
                weather = weathers[Math.floor(Math.random() * weathers.length)];
            }

            weatherChangeDelay = (Math.random() * 10 + 3) * 60; // 10~20秒
        }
    }

    // 水洼
    function initPuddles() {
        puddles = [];
        for (let i = 0; i < puddleCount; i++) {
            puddles.push({
                x: road.x + Math.random() * (road.width - 40),
                y: -Math.random() * canvas.height,
                size: 30 + Math.random() * 20
            });
        }
    }

    function drawPuddles() {
        if (weather !== 'rainy') return;
        ctx.fillStyle = 'rgba(0, 100, 200, 0.4)';
        puddles.forEach(p => {
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    // 道路
    const road = {
        width: 300,
        color: '#666',
        x: 0
    };

    // 键盘
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') player.dx = -player.speed;
        if (e.key === 'ArrowRight') player.dx = player.speed;
        if (e.key === ' ' && gameRunning && !isPaused) pauseGame();
        else if (e.key === ' ' && isPaused) resumeGame();
    });
    document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.dx = 0;
    });

    // 窗口
    function resizeCanvas() {
        const container = document.getElementById('game-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        road.x = (canvas.width - road.width) / 2;
        player.y = canvas.height - 150;
        player.x = road.x + (road.width - player.width) / 2;
        initRain();
    }

    // 绘图
    function drawMarioKart(x, y, w, h) {
        ctx.fillStyle = '#222';
        ctx.fillRect(x - 5, y + h - 20, 10, 20);
        ctx.fillRect(x + w - 5, y + h - 20, 10, 20);
        ctx.fillRect(x - 5, y + 10, 10, 15);
        ctx.fillRect(x + w - 5, y + 10, 10, 15);
        ctx.fillStyle = '#d93636';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(x + 5, y + 25, w - 10, 15);
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.arc(x + w/2, y + 10, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#d93636';
        ctx.fillRect(x + 2, y - 5, w - 4, 10);
        ctx.fillRect(x - 2, y - 5, w + 4, 4);
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.arc(x + w/2 + 8, y + 12, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawGoomba(x, y, w, h) {
        ctx.fillStyle = '#8B4513';
        ctx.beginPath();
        ctx.moveTo(x + w/2, y);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x, y + h);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.fillRect(x + 10, y + 20, 15, 20);
        ctx.fillRect(x + w - 25, y + 20, 15, 20);
        ctx.fillStyle = 'black';
        ctx.fillRect(x + 15, y + 25, 5, 10);
        ctx.fillRect(x + w - 20, y + 25, 5, 10);
        ctx.fillStyle = 'black';
        ctx.fillRect(x + 8, y + 15, 20, 5);
        ctx.fillRect(x + w - 28, y + 15, 20, 5);
    }

    function drawTruck(x, y, w, h) {
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(x + 15, y + h, 10, 0, Math.PI * 2);
        ctx.arc(x + w - 15, y + h, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4169E1';
        ctx.fillRect(x, y + 30, w, h - 30);
        ctx.fillStyle = '#FF6347';
        ctx.fillRect(x, y, w, 30);
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(x + 10, y + 35, w - 20, 20);
    }

    function spawnTruck() {
        if(truck) return;
        const laneWidth = road.width / 3;
        const lane = Math.floor(Math.random() * 3);
        const truckX = road.x + (lane * laneWidth) + (laneWidth/2) - 30;
        truck = { x: truckX, y: -150, width: 60, height: 100, speed: gameSpeed + 2 };
    }

    function drawRoad() {
        const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGradient.addColorStop(0, '#1a5f7a');
        bgGradient.addColorStop(0.3, '#3a7d44');
        bgGradient.addColorStop(0.6, '#55aa55');
        bgGradient.addColorStop(1, '#2d6a32');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const roadGradient = ctx.createLinearGradient(road.x, 0, road.x + road.width, 0);
        roadGradient.addColorStop(0, '#555');
        roadGradient.addColorStop(0.5, '#777');
        roadGradient.addColorStop(1, '#555');
        ctx.fillStyle = roadGradient;
        ctx.fillRect(road.x, 0, road.width, canvas.height);

        ctx.fillStyle = '#fff';
        ctx.fillRect(road.x - 5, 0, 5, canvas.height);
        ctx.fillRect(road.x + road.width, 0, 5, canvas.height);

        let lineOffset = (frameCount * gameSpeed) % 40;
        for (let i = -40; i < canvas.height; i += 40) {
            ctx.fillRect(road.x + road.width/2 - 2, i + lineOffset, 4, 20);
        }
    }

    function spawnObstacle() {
        const laneWidth = road.width / 3;
        const lane = Math.floor(Math.random() * 3);
        const obsX = road.x + (lane * laneWidth) + (laneWidth/2) - 20;
        obstacles.push({ x: obsX, y: -100, width: 40, height: 40, type: 'goomba' });
    }

    function checkCollision(rect1, rect2) {
        return (
            rect1.x < rect2.x + rect2.width &&
            rect1.x + rect1.width > rect2.x &&
            rect1.y < rect2.y + rect2.height &&
            rect1.y + rect1.height > rect2.y
        );
    }

    // 主循环
    function update() {
        if (!gameRunning || isPaused) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        autoChangeWeather(); // 自动换天气
        drawRoad();
        drawRain();
        drawFog();

        // 水洼移动
        if (weather === 'rainy') {
            puddles.forEach(p => {
                p.y += gameSpeed;
                if (p.y > canvas.height) { p.y = -50; p.x = road.x + Math.random() * (road.width - 40); }
            });
            drawPuddles();
        }

        // 打滑
        if (player.isSlipping) {
            player.x += player.slipForce;
            player.slipTime--;
            if (player.slipTime <= 0) {
                player.isSlipping = false;
                player.slipForce = 0;
            }
        }

        // 玩家移动
        player.x += player.dx;
        if (player.x < road.x) player.x = road.x;
        if (player.x + player.width > road.x + road.width) player.x = road.x + road.width - player.width;
        drawMarioKart(player.x, player.y, player.width, player.height);

        frameCount++;
        let spawnRate = 60;
        if (score > 500) spawnRate = 45;
        if (score > 1000) spawnRate = 30;
        if (frameCount % spawnRate === 0) spawnObstacle();
        if (frameCount % truckInterval === 0) spawnTruck();

        // 障碍物
        obstacles.forEach((obs, index) => {
            obs.y += gameSpeed;
            drawGoomba(obs.x, obs.y, obs.width, obs.height);
            if (checkCollision(player, obs)) gameOver();
            if (obs.y > canvas.height) {
                obstacles.splice(index, 1);
                score += 10;
                scoreBoard.innerText = `当前分数: ${score}`;
                if (score % 100 === 0) gameSpeed += 0.5;
            }
        });

        // 卡车
        if (truck) {
            truck.y += truck.speed;
            drawTruck(truck.x, truck.y, truck.width, truck.height);
            if (checkCollision(player, truck)) gameOver();
            if (truck.y > canvas.height) { truck = null; score += 30; scoreBoard.innerText = `当前分数: ${score}`; }
        }

        // 水洼碰撞
        if (weather === 'rainy') {
            puddles.forEach(p => {
                if (
                    player.x < p.x + p.size &&
                    player.x + player.width > p.x - p.size &&
                    player.y < p.y + p.size &&
                    player.y + player.height > p.y - p.size
                ) {
                    if (!player.isSlipping) {
                        player.isSlipping = true;
                        player.slipTime = 40;
                        player.slipForce = (Math.random() > 0.5 ? 1 : -1) * MAX_SLIP_FORCE;
                    }
                }
            });
        }

        animationId = requestAnimationFrame(update);
    }

    function pauseGame() { if (!gameRunning || isPaused) return; isPaused = true; pauseScreen.classList.remove('hidden'); }
    function resumeGame() { if (!isPaused) return; isPaused = false; pauseScreen.classList.add('hidden'); update(); }
    function startGame() {
        gameRunning = true; isPaused = false; score = 0; gameSpeed = 5;
        obstacles = []; truck = null; frameCount = 0;
        player.isSlipping = false; player.slipTime = 0;
        player.x = road.x + (road.width - player.width) / 2;
        initPuddles();
        pauseScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        scoreBoard.classList.remove('hidden');
        scoreBoard.innerText = `当前分数: ${score}`;
        update();
    }
    function gameOver() {
        gameRunning = false; isPaused = false;
        cancelAnimationFrame(animationId);
        finalScoreSpan.innerText = score;
        scoreBoard.classList.add('hidden');
        pauseScreen.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
    }
    function endGame() {
        gameRunning = false; isPaused = false;
        cancelAnimationFrame(animationId);
        pauseScreen.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        scoreBoard.classList.add('hidden');
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
</script>
</body>
</html>
